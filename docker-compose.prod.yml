version: "3.9"

# Production-oriented compose file (single VPS).
# Use with: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: prh-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prh-backend
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prh-network
    # Exposed only via Nginx in production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prh-frontend
    restart: always
    networks:
      - prh-network

  n8n:
    image: n8nio/n8n:latest
    container_name: prh-n8n
    restart: always
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.yourdomain.com}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - GENERIC_TIMEZONE=Africa/Lagos
      - TZ=Africa/Lagos
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - prh-network
    depends_on:
      - postgres

  # Nginx reverse proxy would typically sit in front (or use host Nginx).
  # Example configuration lives in docs/DEPLOYMENT_SPEC.md

volumes:
  postgres_data:
  n8n_data:

networks:
  prh-network:
    driver: bridge
